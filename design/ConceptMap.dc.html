<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECEEF1;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}button{font:inherit;cursor:pointer}a{color:oklch(0.45 0.14 250)}a:hover{color:oklch(0.35 0.14 250)}</style>
</helmet>
<div style="background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box;box-shadow:0 1px 2px rgba(20,22,30,.06);font-family:'DM Sans',sans-serif;color:#1B1D22">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <span style="font-size:13px;font-weight:700;color:#FFFFFF;background:oklch(0.52 0.12 195);border-radius:999px;padding:5px 12px;flex-shrink:0">Concept map</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em">{{ title }}</span>
    </div>
    <span style="font-size:14px;color:#5C606B">Click a concept · drag to rearrange</span>
  </div>
  <div ref="{{ areaRef }}" onPointerMove="{{ onMove }}" onPointerUp="{{ onUp }}" onPointerLeave="{{ onUp }}" onClick="{{ onBg }}" style="position:relative;border-radius:16px;background:oklch(0.97 0.015 195);overflow:hidden;touch-action:none;height:{{ height }}">
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none">
      <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
        <line x1="{{ l.x1 }}" y1="{{ l.y1 }}" x2="{{ l.x2 }}" y2="{{ l.y2 }}" stroke="{{ l.color }}" stroke-width="{{ l.w }}" vector-effect="non-scaling-stroke" stroke-linecap="round"></line>
      </sc-for>
    </svg>
    <sc-for list="{{ links }}" as="l" hint-placeholder-count="4">
      <sc-if value="{{ l.hasLabel }}"><span style="position:absolute;transform:translate(-50%,-50%);font-size:12px;font-weight:700;background:#FFFFFF;border-radius:999px;padding:2px 8px;white-space:nowrap;pointer-events:none;left:{{ l.mx }};top:{{ l.my }};color:{{ l.textColor }};opacity:{{ l.opacity }}">{{ l.label }}</span></sc-if>
    </sc-for>
    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="5">
      <button onPointerDown="{{ n.onDown }}" onClick="{{ n.onClick }}" style="position:absolute;transform:translate(-50%,-50%);border-radius:14px;padding:9px 14px;font-size:15px;font-weight:700;white-space:nowrap;cursor:grab;touch-action:none;transition:opacity .15s,box-shadow .15s;left:{{ n.left }};top:{{ n.top }};background:{{ n.bg }};color:{{ n.color }};border:2px solid {{ n.border }};opacity:{{ n.opacity }};box-shadow:{{ n.shadow }}">{{ n.label }}</button>
    </sc-for>
  </div>
  <sc-if value="{{ hasSel }}">
    <div style="display:flex;flex-direction:column;gap:6px;background:#F4F5F7;border-radius:14px;padding:14px">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:20px;font-weight:700">{{ selLabel }}</span>
      <sc-if value="{{ hasNote }}"><span style="font-size:15px;line-height:1.5;color:#3E424B;text-wrap:pretty">{{ selNote }}</span></sc-if>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        <sc-for list="{{ rels }}" as="r"><span style="font-size:14px;background:#FFFFFF;border-radius:999px;padding:5px 10px;color:#3E424B">{{ r }}</span></sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:600},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;How an ecosystem fits together&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nodes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id:string, label:string, x:number(%), y:number(%), note?:string}[]&quot;},&quot;links&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{from:string, to:string, label?:string}[]&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:420,&quot;min&quot;:240,&quot;max&quot;:900,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const DEMO_NODES = [
  { id: 'eco', label: 'Ecosystem', x: 50, y: 14, note: 'All the living things in an area plus their physical environment.' },
  { id: 'prod', label: 'Producers', x: 18, y: 45, note: 'Make their own food from sunlight: plants, algae.' },
  { id: 'cons', label: 'Consumers', x: 50, y: 50, note: 'Get energy by eating other organisms.' },
  { id: 'dec', label: 'Decomposers', x: 82, y: 45, note: 'Break down dead matter and return nutrients to the soil.' },
  { id: 'sun', label: 'Sunlight', x: 14, y: 84 },
  { id: 'nut', label: 'Soil nutrients', x: 70, y: 84 },
  { id: 'herb', label: 'Herbivores', x: 40, y: 80 }
];
const DEMO_LINKS = [
  { from: 'eco', to: 'prod', label: 'includes' }, { from: 'eco', to: 'cons', label: 'includes' }, { from: 'eco', to: 'dec', label: 'includes' },
  { from: 'sun', to: 'prod', label: 'powers' }, { from: 'prod', to: 'herb', label: 'eaten by' }, { from: 'herb', to: 'cons', label: 'are' },
  { from: 'dec', to: 'nut', label: 'release' }, { from: 'nut', to: 'prod', label: 'feed' }
];
const parse = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return []; } } return v; };
const T = 'oklch(0.52 0.12 195)';

class Component extends DCLogic {
  areaRef = React.createRef();
  state = { pos: {}, sel: null, drag: null, moved: false };
  demo() { return this.props.nodes == null; }
  nodes() { return this.demo() ? DEMO_NODES : parse(this.props.nodes) || []; }
  links() { return this.demo() ? DEMO_LINKS : parse(this.props.links) || []; }
  onMove = e => {
    const d = this.state.drag; if (!d) return;
    const r = this.areaRef.current.getBoundingClientRect();
    const x = Math.max(4, Math.min(96, ((e.clientX - r.left) / r.width) * 100)), y = Math.max(5, Math.min(95, ((e.clientY - r.top) / r.height) * 100));
    this.setState(s => ({ pos: { ...s.pos, [d]: { x, y } }, moved: true }));
  };
  onUp = () => { if (this.state.drag) setTimeout(() => this.setState({ drag: null }), 0); };
  renderVals() {
    const N = this.nodes(), L = this.links(), { pos, sel } = this.state;
    const P = id => { const n = N.find(x => x.id === id) || { x: 0, y: 0 }; return pos[id] || { x: n.x, y: n.y }; };
    const nb = new Set(sel ? L.flatMap(l => l.from === sel ? [l.to] : l.to === sel ? [l.from] : []) : []);
    const selNode = N.find(n => n.id === sel);
    const lab = id => (N.find(n => n.id === id) || {}).label;
    return {
      title: this.props.title ?? 'How an ecosystem fits together',
      height: (this.props.height ?? 420) + 'px', areaRef: this.areaRef,
      onMove: this.onMove, onUp: this.onUp,
      onBg: e => { if (e.target === e.currentTarget) this.setState({ sel: null }); },
      links: L.map(l => {
        const a = P(l.from), b = P(l.to), on = sel && (l.from === sel || l.to === sel);
        return { x1: a.x, y1: a.y, x2: b.x, y2: b.y, mx: (a.x + b.x) / 2 + '%', my: (a.y + b.y) / 2 + '%', label: l.label || '', hasLabel: !!l.label, color: on ? T : sel ? 'oklch(0.9 0.02 195)' : 'oklch(0.78 0.06 195)', w: on ? 3 : 2, textColor: on ? 'oklch(0.4 0.1 195)' : '#5C606B', opacity: sel && !on ? 0.35 : 1 };
      }),
      nodes: N.map(n => {
        const p = P(n.id), s = sel === n.id, near = nb.has(n.id), dim = sel && !s && !near;
        return {
          label: n.label, left: p.x + '%', top: p.y + '%',
          bg: s ? T : '#FFFFFF', color: s ? '#FFFFFF' : '#1B1D22', border: s ? T : near ? T : 'oklch(0.88 0.04 195)',
          opacity: dim ? 0.4 : 1, shadow: s ? '0 4px 14px rgba(20,90,100,.25)' : '0 1px 3px rgba(20,22,30,.08)',
          onDown: () => this.setState({ drag: n.id, moved: false }),
          onClick: e => { e.stopPropagation(); if (!this.state.moved) this.setState(st => ({ sel: st.sel === n.id ? null : n.id })); }
        };
      }),
      hasSel: !!selNode, selLabel: selNode ? selNode.label : '', selNote: selNode?.note || '', hasNote: !!selNode?.note,
      rels: sel ? L.filter(l => l.from === sel || l.to === sel).map(l => `${lab(l.from)} ${l.label || '→'} ${lab(l.to)}`) : []
    };
  }
}
</script>
</body>
</html>
