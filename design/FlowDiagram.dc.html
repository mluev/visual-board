<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECEEF1;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}button{font:inherit;cursor:pointer}a{color:oklch(0.45 0.14 250)}a:hover{color:oklch(0.35 0.14 250)}</style>
</helmet>
<div style="background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;box-shadow:0 1px 2px rgba(20,22,30,.06);font-family:'DM Sans',sans-serif;color:#1B1D22">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <span style="font-size:13px;font-weight:700;color:#FFFFFF;background:oklch(0.52 0.12 195);border-radius:999px;padding:5px 12px;flex-shrink:0">Flow</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em">{{ title }}</span>
    </div>
    <button onClick="{{ restart }}" style="border:none;border-radius:999px;background:#F4F5F7;padding:8px 14px;font-size:14px;font-weight:700;color:#1B1D22">Start over</button>
  </div>
  <sc-if value="{{ hasCase }}"><div style="font-size:16px;line-height:1.5;background:oklch(0.97 0.015 195);border-radius:14px;padding:12px 14px;text-wrap:pretty"><b>Example:</b> {{ caseText }}</div></sc-if>
  <div style="display:flex;flex-direction:column;align-items:center;gap:0">
    <sc-for list="{{ nodes }}" as="n" hint-placeholder-count="4">
      <sc-if value="{{ n.showArrow }}"><div style="display:flex;flex-direction:column;align-items:center;height:30px"><div style="width:2px;flex:1;background:{{ n.arrowColor }}"></div><div style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid {{ n.arrowColor }}"></div></div></sc-if>
      <div style="display:flex;flex-direction:column;align-items:center;gap:10px;max-width:520px;width:100%;padding:14px 18px;box-sizing:border-box;text-align:center;transition:background .2s,border-color .2s,opacity .2s;background:{{ n.bg }};border:2px solid {{ n.border }};border-radius:{{ n.radius }};opacity:{{ n.opacity }}">
        <span style="font-size:12px;font-weight:700;letter-spacing:.02em;color:{{ n.kindColor }}">{{ n.kind }}</span>
        <span style="font-size:17px;font-weight:{{ n.weight }};line-height:1.35;text-wrap:balance">{{ n.text }}</span>
        <sc-if value="{{ n.hasNote }}"><span style="font-size:14px;line-height:1.45;color:#3E424B;text-wrap:pretty">{{ n.note }}</span></sc-if>
        <sc-if value="{{ n.ask }}">
          <div style="display:flex;gap:8px">
            <button onClick="{{ n.onYes }}" style="border:none;border-radius:999px;background:oklch(0.52 0.12 195);color:#FFFFFF;padding:9px 18px;font-size:15px;font-weight:700">{{ n.yesLabel }}</button>
            <button onClick="{{ n.onNo }}" style="border:none;border-radius:999px;background:#FFFFFF;color:#1B1D22;padding:9px 18px;font-size:15px;font-weight:700;box-shadow:inset 0 0 0 2px oklch(0.85 0.05 195)">{{ n.noLabel }}</button>
          </div>
        </sc-if>
        <sc-if value="{{ n.chose }}"><span style="font-size:13px;font-weight:700;color:oklch(0.4 0.1 195)">{{ n.choice }}</span></sc-if>
        <sc-if value="{{ n.canNext }}"><button onClick="{{ n.onNext }}" style="border:none;border-radius:999px;background:oklch(0.52 0.12 195);color:#FFFFFF;padding:8px 16px;font-size:14px;font-weight:700">Next →</button></sc-if>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:640},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Past simple or present perfect?&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nodes&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{id, type:'start'|'step'|'decision'|'end', text, note?, next?, yes?, no?, yesLabel?, noLabel?}[] — first node is the start&quot;},&quot;cases&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[] — example situations to walk through; cycles on Start over&quot;}}">
const DEMO = {
  title: 'Past simple or present perfect?',
  cases: ['"I ___ (lose) my keys, so I can\u2019t get in."', '"She ___ (visit) Rome in 2019."'],
  nodes: [
    { id: 's', type: 'start', text: 'You\u2019re describing a finished action.', next: 'q1' },
    { id: 'q1', type: 'decision', text: 'Do you say, or clearly mean, WHEN it happened?', yes: 'ps', no: 'q2', note: 'e.g. yesterday, in 2019, last week, when I was a kid' },
    { id: 'q2', type: 'decision', text: 'Does it matter NOW (a result, or experience up to now)?', yes: 'pp', no: 'ps' },
    { id: 'pp', type: 'end', text: 'Present perfect: have/has + past participle', note: '"I have lost my keys." The result (no keys) is true now.' },
    { id: 'ps', type: 'end', text: 'Past simple: verb + -ed or the irregular form', note: '"She visited Rome in 2019." A finished time in the past.' }
  ]
};
const parse = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return null; } } return v; };
const T = 'oklch(0.52 0.12 195)';
const KIND = { start: 'START', step: 'STEP', decision: 'QUESTION', end: 'RESULT' };

class Component extends DCLogic {
  state = { path: [], choices: {}, ci: 0 };
  cfg() { return this.props.nodes == null ? DEMO : { title: this.props.title, cases: parse(this.props.cases) || [], nodes: parse(this.props.nodes) || [] }; }
  componentDidMount() { const N = this.cfg().nodes; if (N[0]) this.setState({ path: [N[0].id] }); }
  go(from, to, choice) { this.setState(s => ({ path: [...s.path.slice(0, s.path.indexOf(from) + 1), to], choices: { ...s.choices, [from]: choice } })); }
  renderVals() {
    const C = this.cfg(), N = C.nodes, { path, choices, ci } = this.state;
    const byId = Object.fromEntries(N.map(n => [n.id, n]));
    const cur = path[path.length - 1];
    const show = path.length ? path.map(id => byId[id]).filter(Boolean) : N.slice(0, 1);
    return {
      title: this.props.title ?? C.title ?? 'Flow',
      hasCase: C.cases.length > 0, caseText: C.cases[ci % Math.max(1, C.cases.length)] || '',
      restart: () => this.setState(s => ({ path: N[0] ? [N[0].id] : [], choices: {}, ci: s.ci + 1 })),
      nodes: show.map((n, k) => {
        const active = n.id === cur, dec = n.type === 'decision', end = n.type === 'end';
        return {
          showArrow: k > 0, arrowColor: T,
          text: n.text, note: n.note || '', hasNote: !!n.note && (active || end),
          kind: KIND[n.type] || 'STEP', kindColor: active ? 'oklch(0.4 0.1 195)' : '#8A8F99',
          bg: end && active ? 'oklch(0.95 0.04 155)' : active ? 'oklch(0.97 0.02 195)' : '#FFFFFF',
          border: end && active ? 'oklch(0.48 0.13 155)' : active ? T : '#E2E4E9',
          radius: dec ? '28px' : n.type === 'start' ? '999px' : '16px', weight: active ? 700 : 500, opacity: active ? 1 : 0.75,
          ask: dec && active, yesLabel: n.yesLabel || 'Yes', noLabel: n.noLabel || 'No',
          onYes: () => this.go(n.id, n.yes, n.yesLabel || 'Yes'), onNo: () => this.go(n.id, n.no, n.noLabel || 'No'),
          chose: dec && !active && !!choices[n.id], choice: `→ ${choices[n.id] || ''}`,
          canNext: active && !dec && !end && !!n.next, onNext: () => this.go(n.id, n.next, '')
        };
      })
    };
  }
}
</script>
</body>
</html>
