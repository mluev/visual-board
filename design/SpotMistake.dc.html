<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECEEF1;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}button{font:inherit;cursor:pointer}a{color:oklch(0.45 0.14 250)}a:hover{color:oklch(0.35 0.14 250)}</style>
</helmet>
<div style="background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;box-shadow:0 1px 2px rgba(20,22,30,.06);font-family:'DM Sans',sans-serif;color:#1B1D22">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <span style="font-size:13px;font-weight:700;color:#FFFFFF;background:oklch(0.5 0.11 85);border-radius:999px;padding:5px 12px;flex-shrink:0">Spot it</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em">{{ title }}</span>
    </div>
    <span style="font-size:14px;font-weight:500;color:#5C606B;flex-shrink:0">{{ countLabel }}</span>
  </div>
  <div style="font-size:15px;color:#5C606B">{{ instruction }}</div>
  <div style="display:flex;flex-direction:column;gap:2px;background:#F4F5F7;border-radius:14px;padding:8px">
    <sc-for list="{{ lines }}" as="l" hint-placeholder-count="5">
      <div style="display:flex;flex-direction:column">
        <button onClick="{{ l.onClick }}" style="display:flex;gap:12px;align-items:baseline;text-align:left;border-radius:10px;padding:7px 10px;font-size:{{ l.size }};line-height:1.5;color:#1B1D22;background:{{ l.bg }};border:2px solid {{ l.border }};font-family:{{ l.font }}">
          <span style="font-size:12px;font-weight:500;color:#8A8F99;min-width:18px;text-align:right;font-family:'JetBrains Mono',monospace">{{ l.n }}</span>
          <span style="flex:1;white-space:pre-wrap">{{ l.text }}</span>
          <sc-if value="{{ l.hasMark }}"><span style="font-size:12px;font-weight:700;white-space:nowrap;font-family:'DM Sans',sans-serif;color:{{ l.markColor }}">{{ l.mark }}</span></sc-if>
        </button>
        <sc-if value="{{ l.showFix }}"><div style="margin:4px 10px 8px 40px;font-size:14px;line-height:1.45;color:#3E424B;text-wrap:pretty"><span style="font-weight:700;color:oklch(0.48 0.13 155)">Fix: </span><span style="font-family:{{ l.font }}">{{ l.fix }}</span><sc-if value="{{ l.hasWhy }}"><span> — {{ l.why }}</span></sc-if></div></sc-if>
      </div>
    </sc-for>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:16px;border-top:1px solid #ECEEF1;flex-wrap:wrap">
    <sc-if value="{{ submitted }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:baseline;gap:12px">
        <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:36px;font-weight:700;line-height:1;color:oklch(0.42 0.1 85)">{{ score }}</span>
        <span style="font-size:15px;color:#3E424B">{{ scoreLine }}</span>
      </div>
      <button onClick="{{ reset }}" style="background:oklch(0.95 0.04 85);color:#1B1D22;border:none;border-radius:999px;padding:11px 18px;font-size:15px;font-weight:700">Try again</button>
    </sc-if>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ true }}">
      <span style="font-size:15px;color:#5C606B">{{ flaggedLine }}</span>
      <button onClick="{{ submit }}" style="background:oklch(0.5 0.11 85);color:#FFFFFF;border:none;border-radius:999px;padding:12px 22px;font-size:15px;font-weight:700;opacity:{{ submitOp }}">Check</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Find the bugs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lines&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string | {text:string, fix?:string, why?:string})[] — lines with fix are the mistakes&quot;},&quot;instruction&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mono&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;initial&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;blank&quot;,&quot;submitted&quot;],&quot;default&quot;:&quot;blank&quot;,&quot;tsType&quot;:&quot;'blank'|'submitted'&quot;}}">
const DEMO = [
  { text: 'func sum(nums []int) int {' },
  { text: '    total := 0' },
  { text: '    for i := 0; i <= len(nums); i++ {', fix: 'for i := 0; i < len(nums); i++ {', why: '<= reads one past the end and panics with index out of range.' },
  { text: '        total += nums[i]' },
  { text: '    }' },
  { text: '    return nums', fix: 'return total', why: 'The function should return the sum, not the slice — this won\u2019t even compile.' },
  { text: '}' }
];
const parse = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return []; } } return v; };

class Component extends DCLogic {
  state = this.initState();
  lines() { const p = parse(this.props.lines); return Array.isArray(p) && p.length ? p.map(l => typeof l === 'string' ? { text: l } : l) : DEMO; }
  mono() { return this.props.mono ?? this.props.lines == null; }
  initState() { return this.props.initial === 'submitted' ? { flags: [2, 3], submitted: true } : { flags: [], submitted: false }; }
  toggle(i) { if (this.state.submitted) return; this.setState(s => ({ flags: s.flags.includes(i) ? s.flags.filter(x => x !== i) : [...s.flags, i] })); }
  submit = () => { if (!this.state.flags.length) return; this.setState({ submitted: true }); };
  reset = () => this.setState({ flags: [], submitted: false });
  renderVals() {
    const L = this.lines(), { flags, submitted } = this.state, mono = this.mono();
    const bad = L.map((l, i) => l.fix != null ? i : -1).filter(i => i >= 0);
    const found = bad.filter(i => flags.includes(i)).length, falsePos = flags.filter(i => !bad.includes(i)).length;
    return {
      title: this.props.title ?? 'Find the bugs',
      countLabel: `${bad.length} mistake${bad.length === 1 ? '' : 's'}`,
      instruction: this.props.instruction ?? `Click every line that has a mistake. There ${bad.length === 1 ? 'is 1' : 'are ' + bad.length}.`,
      lines: L.map((l, i) => {
        const f = flags.includes(i), isBad = l.fix != null;
        let bg = 'transparent', border = 'transparent', mark = '', markColor = '#1B1D22';
        if (!submitted && f) { bg = 'oklch(0.95 0.04 85)'; border = 'oklch(0.5 0.11 85)'; mark = 'Flagged'; markColor = 'oklch(0.42 0.1 85)'; }
        if (submitted && isBad) { bg = f ? 'oklch(0.95 0.04 155)' : 'oklch(0.95 0.03 25)'; border = f ? 'oklch(0.48 0.13 155)' : 'oklch(0.52 0.17 25)'; mark = f ? 'Found' : 'Missed'; markColor = f ? 'oklch(0.48 0.13 155)' : 'oklch(0.52 0.17 25)'; }
        if (submitted && !isBad && f) { bg = '#FFFFFF'; border = '#D5D8DE'; mark = 'This line is fine'; markColor = '#5C606B'; }
        return { n: i + 1, text: l.text, font: mono ? "'JetBrains Mono',monospace" : "'DM Sans',sans-serif", size: mono ? '14px' : '16px', bg, border, hasMark: !!mark, mark, markColor, onClick: () => this.toggle(i), showFix: submitted && isBad, fix: (l.fix || '').trim(), why: l.why || '', hasWhy: !!l.why };
      }),
      submitted, open: !submitted, submit: this.submit, reset: this.reset,
      flaggedLine: `${flags.length} flagged`, submitOp: flags.length ? 1 : 0.35,
      score: `${found}/${bad.length}`,
      scoreLine: found === bad.length && !falsePos ? 'Found them all.' : `${found} found${falsePos ? `, ${falsePos} flagged by mistake` : ''}.`
    };
  }
}
</script>
</body>
</html>
