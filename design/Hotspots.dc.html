<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="./image-slot.js"></script>
<style>body{margin:0;background:#ECEEF1;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}button{font:inherit;cursor:pointer}a{color:oklch(0.45 0.14 250)}a:hover{color:oklch(0.35 0.14 250)}</style>
</helmet>
<div style="background:#FFFFFF;border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box;box-shadow:0 1px 2px rgba(20,22,30,.06);font-family:'DM Sans',sans-serif;color:#1B1D22">
  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;align-items:center;gap:12px;min-width:0">
      <span style="font-size:13px;font-weight:700;color:#FFFFFF;background:oklch(0.52 0.12 195);border-radius:999px;padding:5px 12px;flex-shrink:0">Explore</span>
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:19px;font-weight:700;letter-spacing:-.01em">{{ title }}</span>
    </div>
    <span style="font-size:14px;font-weight:500;color:#5C606B">{{ progress }}</span>
  </div>
  <div style="position:relative;border-radius:16px;overflow:hidden;background:#F4F5F7;aspect-ratio:{{ aspect }}">
    <sc-if value="{{ hasImage }}"><img src="{{ image }}" alt="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover"></sc-if>
    <sc-if value="{{ noImage }}"><image-slot id="{{ slotId }}" shape="rect" placeholder="{{ placeholder }}" style="position:absolute;inset:0;width:100%;height:100%"></image-slot></sc-if>
    <sc-for list="{{ spots }}" as="s" hint-placeholder-count="4">
      <button onClick="{{ s.onClick }}" aria-label="{{ s.title }}" style="position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;box-shadow:0 0 0 6px {{ s.halo }},0 2px 8px rgba(0,0,0,.3);transition:box-shadow .2s,background .2s;left:{{ s.left }};top:{{ s.top }};background:{{ s.bg }};color:{{ s.color }};border:3px solid #FFFFFF">{{ s.n }}</button>
    </sc-for>
  </div>
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;background:oklch(0.97 0.015 195);border-radius:16px;padding:16px 18px;min-height:84px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-family:'Bricolage Grotesque',sans-serif;font-size:21px;font-weight:700">{{ selTitle }}</span>
      <span style="font-size:15px;line-height:1.5;color:#3E424B;text-wrap:pretty">{{ selBody }}</span>
    </div>
    <div style="display:flex;gap:6px;flex-shrink:0">
      <button onClick="{{ prev }}" aria-label="Previous" style="width:36px;height:36px;border:none;border-radius:50%;background:#FFFFFF;font-size:15px;color:#1B1D22">←</button>
      <button onClick="{{ next }}" aria-label="Next" style="width:36px;height:36px;border:none;border-radius:50%;background:#FFFFFF;font-size:15px;color:#1B1D22">→</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:620},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Layers of the Earth&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string (url) — omit to show a drop slot&quot;},&quot;slotId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;hotspots-demo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;aspect&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;16 / 9&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;spots&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{x:number(%), y:number(%), title:string, body:string}[]&quot;}}">
const DEMO = [
  { x: 22, y: 30, title: 'Crust', body: 'The thin rocky outer layer: 5–70 km thick. All life lives on it.' },
  { x: 40, y: 52, title: 'Mantle', body: 'Hot, slowly flowing rock about 2,900 km thick. Convection here moves the tectonic plates.' },
  { x: 60, y: 62, title: 'Outer core', body: 'Liquid iron and nickel. Its flow generates Earth\u2019s magnetic field.' },
  { x: 72, y: 72, title: 'Inner core', body: 'Solid iron at about 5,400 °C. The pressure is so high it can\u2019t melt.' }
];
const parse = v => { if (typeof v === 'string') { try { return JSON.parse(v); } catch (e) { return []; } } return v; };
const T = 'oklch(0.52 0.12 195)';

class Component extends DCLogic {
  state = { a: null, seen: [] };
  spots() { const p = parse(this.props.spots); return Array.isArray(p) && p.length ? p : DEMO; }
  pick(i) { this.setState(s => ({ a: i, seen: s.seen.includes(i) ? s.seen : [...s.seen, i] })); }
  renderVals() {
    const S = this.spots(), { a, seen } = this.state, cur = a != null ? S[a] : null;
    return {
      title: this.props.title ?? 'Layers of the Earth',
      progress: `${seen.length} / ${S.length} explored`,
      image: this.props.image || '', hasImage: !!this.props.image, noImage: !this.props.image,
      slotId: this.props.slotId ?? 'hotspots-demo', placeholder: this.props.placeholder ?? 'Drop an image (e.g. a cross-section of the Earth)',
      aspect: this.props.aspect ?? '16 / 9',
      spots: S.map((s, i) => ({ n: i + 1, title: s.title, left: s.x + '%', top: s.y + '%', onClick: () => this.pick(i),
        bg: a === i ? T : seen.includes(i) ? '#FFFFFF' : T, color: a === i || !seen.includes(i) ? '#FFFFFF' : oklchText(),
        halo: a === i ? 'oklch(0.52 0.12 195 / .35)' : seen.includes(i) ? 'transparent' : 'oklch(0.52 0.12 195 / .2)' })),
      selTitle: cur ? cur.title : 'Tap a numbered point',
      selBody: cur ? cur.body : `There are ${S.length} points to explore. Use the arrows for a guided tour.`,
      prev: () => this.pick(a == null ? S.length - 1 : (a - 1 + S.length) % S.length),
      next: () => this.pick(a == null ? 0 : (a + 1) % S.length)
    };
  }
}
function oklchText() { return 'oklch(0.4 0.1 195)'; }
</script>
</body>
</html>
