<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#ECEEF1;-webkit-font-smoothing:antialiased;font-variant-ligatures:none}button{font:inherit;cursor:pointer}a{color:#1B1D22;text-decoration:none}a:hover{color:#1B1D22}</style>
</helmet>
<main style="max-width:1160px;margin:0 auto;padding:40px 24px 64px;display:flex;flex-direction:column;gap:24px;font-family:'DM Sans',sans-serif;color:#1B1D22">
  <header style="display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding:0 8px">
    <div style="display:flex;flex-direction:column;gap:6px">
      <span style="font-size:14px;font-weight:700;color:#5C606B">Course map</span>
      <h1 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:44px;font-weight:700;line-height:1.05;letter-spacing:-.025em">What you're learning</h1>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="3">
        <button onClick="{{ f.onClick }}" style="border:none;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;background:{{ f.bg }};color:{{ f.color }}">{{ f.label }}</button>
      </sc-for>
    </div>
  </header>
  <sc-for list="{{ groups }}" as="g" hint-placeholder-count="1">
    <section style="display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;gap:12px;padding:0 8px">
        <h2 style="margin:0;font-family:'Bricolage Grotesque',sans-serif;font-size:26px;font-weight:700;letter-spacing:-.015em">{{ g.subject }}</h2>
        <span style="font-size:14px;font-weight:500;color:#5C606B">{{ g.count }}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px">
        <sc-for list="{{ g.boards }}" as="b" hint-placeholder-count="3">
          <a href="{{ b.file }}" style="background:#FFFFFF;border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,22,30,.06);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,22,30,.08)">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
              <span style="font-size:13px;font-weight:700;color:#5C606B">{{ b.lesson }}</span>
              <span style="font-size:12px;font-weight:700;border-radius:999px;padding:4px 10px;background:{{ b.statusBg }};color:{{ b.statusColor }}">{{ b.status }}</span>
            </div>
            <div style="font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;line-height:1.15;letter-spacing:-.01em;text-wrap:balance">{{ b.title }}</div>
            <sc-if value="{{ b.hasBlurb }}"><div style="font-size:15px;line-height:1.45;color:#3E424B;text-wrap:pretty">{{ b.blurb }}</div></sc-if>
            <div style="display:flex;flex-direction:column;gap:6px;margin-top:auto">
              <div style="height:8px;background:#F0F1F4;border-radius:4px"><div style="height:8px;border-radius:4px;background:oklch(0.52 0.12 195);width:{{ b.pct }}"></div></div>
              <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:500;color:#5C606B"><span>{{ b.progress }}</span><span>{{ b.minutes }}</span></div>
            </div>
          </a>
        </sc-for>
      </div>
    </section>
  </sc-for>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
// Claude: add one entry per board file. quizIds / deckIds must match the ids used on that board.
const BOARDS = [
  { file: 'Board - Go Slices.dc.html', subject: 'Go', lesson: 'Lesson 3', title: 'Slices, from the inside', blurb: 'len, cap, append and shared backing arrays.', minutes: 15, quizIds: ['go-slices'], deckIds: ['go-slices'] }
];
const read = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };

class Component extends DCLogic {
  state = { filter: 'All', tick: 0 };
  componentDidMount() { this.onFocus = () => this.setState(s => ({ tick: s.tick + 1 })); window.addEventListener('focus', this.onFocus); }
  componentWillUnmount() { window.removeEventListener('focus', this.onFocus); }
  prog(b) {
    const quiz = (b.quizIds || []).map(id => read('lk-quiz-' + id)).filter(Boolean);
    const decks = (b.deckIds || []).map(id => read('lk-deck-' + id)).filter(Boolean);
    const cards = decks.reduce((a, d) => a + Object.keys(d).length, 0);
    const qScore = quiz.length ? quiz.reduce((a, q) => a + q.correct / q.total, 0) / quiz.length : null;
    const parts = (b.quizIds || []).length + (b.deckIds || []).length;
    const done = quiz.length + decks.length;
    const pct = parts ? Math.round(((done / parts) * 0.5 + (qScore ?? 0) * 0.5) * 100) : 0;
    return { qScore, cards, started: done > 0, pct, mastered: qScore === 1 && decks.length === (b.deckIds || []).length };
  }
  renderVals() {
    const boards = this.props.boards || BOARDS, { filter } = this.state;
    const subjects = [...new Set(boards.map(b => b.subject))];
    const shown = filter === 'All' ? subjects : [filter];
    return {
      filters: ['All', ...subjects].map(s => ({ label: s, bg: filter === s ? '#1B1D22' : '#FFFFFF', color: filter === s ? '#FFFFFF' : '#1B1D22', onClick: () => this.setState({ filter: s }) })),
      groups: shown.map(subject => {
        const list = boards.filter(b => b.subject === subject);
        return {
          subject, count: `${list.length} board${list.length === 1 ? '' : 's'}`,
          boards: list.map(b => {
            const p = this.prog(b);
            const st = p.mastered ? ['Mastered', 'oklch(0.95 0.04 155)', 'oklch(0.4 0.12 155)'] : p.started ? ['In progress', 'oklch(0.95 0.04 85)', 'oklch(0.4 0.1 85)'] : ['New', '#F0F1F4', '#3E424B'];
            const bits = []; if (p.qScore != null) bits.push(`Best quiz ${Math.round(p.qScore * 100)}%`); if (p.cards) bits.push(`${p.cards} cards reviewed`);
            return { file: b.file, lesson: b.lesson || '', title: b.title, blurb: b.blurb || '', hasBlurb: !!b.blurb, minutes: b.minutes ? `~${b.minutes} min` : '', status: st[0], statusBg: st[1], statusColor: st[2], pct: p.pct + '%', progress: bits.join(' · ') || 'Not started' };
          })
        };
      })
    };
  }
}
</script>
</body>
</html>
